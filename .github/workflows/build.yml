name: comprobación y compilación

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx electron --version
      - run: npm run vendor
      - run: xvfb-run -a npm test

  windows:
    name: instalador de Windows
    needs: test
    runs-on: windows-latest
    # Publicar la versión adjunta el instalador a la release, y eso necesita
    # permiso de escritura sobre el contenido del repositorio.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run vendor
      - name: Compilar instalador
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: npm run dist
      - name: Compilar y publicar actualizacion
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm run dist:release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: Mundial-TV-Windows
          path: dist/*
          if-no-files-found: error
